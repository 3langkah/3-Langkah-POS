<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiga Langkah Shoecare - Masuk</title>
    <style>
        :root {
            --primary-yellow: #FFD700;
            --dark-text: #1A1A1A;
            --light-bg: #FFFFFF;
            --gray-bg: #F4F4F4;
            --border-radius: 12px;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        body { 
            background-color: var(--gray-bg); 
            color: var(--dark-text); 
        }
        
        .bg-yellow { background-color: var(--primary-yellow); }
        .flex-center { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }

        .login-card {
            background: var(--light-bg);
            padding: 2rem;
            border-radius: var(--border-radius);
            width: 90%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        /* Gunakan nama file logo yang kamu sebutkan sebelumnya jika ada di folder yang sama */
        .logo { 
            width: 120px; 
            border-radius: 50%; 
            margin-bottom: 1rem; 
            object-fit: cover;
        }

        .input-group { 
            margin-bottom: 1.5rem; 
            text-align: left; 
        }
        
        .input-group label { 
            display: block; 
            margin-bottom: 0.5rem; 
            font-weight: bold; 
        }
        
        .input-group input, .input-group select {
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            font-size: 16px;
        }

        .btn-primary {
            background: var(--primary-yellow);
            color: var(--dark-text);
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .btn-primary:active { transform: scale(0.98); }
    </style>
</head>
<body class="bg-yellow flex-center">
    <div class="login-card">
        <!-- Pastikan file gambar ini berada di satu folder dengan index.html -->
        <img src="Gemini_Generated_Image_cvumy8cvumy8cvum (1).jpg" alt="Logo Tiga Langkah" class="logo" onerror="this.src='https://via.placeholder.com/120/FFD700/1A1A1A?text=TL'">
        <h2>Tiga Langkah Shoecare</h2>
        
        <form id="loginForm">
            <div class="input-group">
                <label>Pilih Pengguna</label>
                <select id="username" required>
                    <option value="" disabled selected>-- Pilih Pemilik --</option>
                    <option value="FRANS">FRANS</option>
                    <option value="EKA">EKA</option>
                    <option value="WULAN">WULAN</option>
                </select>
            </div>
            
            <div class="input-group">
                <label>Kata Sandi</label>
                <input type="password" id="password" placeholder="Masukkan kata sandi" required>
            </div>
            
            <button type="submit" class="btn-primary">MASUK</button>
        </form>
    </div>

    <script>
        // Logika autentikasi statis sesuai permintaan
        const kredensial = {
            "FRANS": "Frans3langkah",
            "EKA": "Eka3langkah",
            "WULAN": "Wulan3langkah"
        };

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const pengguna = document.getElementById('username').value;
            const sandi = document.getElementById('password').value;

            if (kredensial[pengguna] && kredensial[pengguna] === sandi) {
                // Simpan sesi aktif ke memori browser
                localStorage.setItem('penggunaAktif', pengguna);
                localStorage.setItem('peran', 'Owner');
                
                alert(`Selamat datang, ${pengguna}!`);
                
                // Arahkan ke dashboard (kamu perlu membuat file dashboard.html nanti)
                window.location.href = 'dashboard.html';
            } else {
                alert('Nama Pengguna atau Kata Sandi salah!');
            }
        });
    </script>
</body>
</html>
